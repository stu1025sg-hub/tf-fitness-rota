<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0b0b">
  <title>TF Fitness Rota</title>

  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: #0b0b0b;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 22px;
    }
    .card {
      width: 100%;
      max-width: 480px;
      background: #171717;
      border: 1px solid #343434;
      border-radius: 18px;
      padding: 26px;
      text-align: center;
    }
    img {
      width: min(220px, 68vw);
      max-height: 170px;
      object-fit: contain;
      margin-bottom: 18px;
    }
    h1 {
      margin: 0 0 10px;
      color: #f4c430;
    }
    p {
      color: #b8b8b8;
      line-height: 1.5;
      margin: 0;
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="./tf-fitness-logo.png" alt="TF Fitness">
    <h1>No internet connection</h1>
    <p>
      TF Fitness Rota needs an internet connection for the live rota,
      PT diary, availability, requests and notifications. Reconnect and
      open the app again.
    </p>
  </div>
</body>
</html>
